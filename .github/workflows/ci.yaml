name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Run Oxlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # vite-plus 0.2.6 から `vp exec oxlint`(oxlint ラッパー bin)は IDE 専用となり
        # exit 1 で何も lint しなくなったため、CLI 互換の `vp lint` を使う
        run: |
          vp lint --deny=correctness --warn=suspicious --warn=perf -f unix | \
            reviewdog -efm="%f:%l:%c: %m" -name="oxlint" \
              -reporter=github-pr-review \
              -filter-mode=added \
              -fail-level=any

      - name: Run tests
        run: vp test

      - name: Type check + lint + format check
        run: vp check

      - name: Build
        run: vp build
