name: Pinact Check

on:
  workflow_dispatch:
  pull_request:

jobs:
  pinact-check:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run pinact
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          skip_push: "true"
